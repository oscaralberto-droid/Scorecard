function buildScorecardForRange(startDate,endDate){
  const filtered=STATE.history.filter(h=>h.date>=startDate&&h.date<=endDate);
  const byAgentCoord={};
  for(const h of filtered){
    const c=getCoordOnDate(h.nameKey,h.date);
    const coord=c?c.coord:'';
    const key=h.nameKey+'|'+coord;
    if(!byAgentCoord[key])byAgentCoord[key]={n:0,coord,...emptyAccumulator()};
    accumulate(byAgentCoord[key],h);
    byAgentCoord[key].n++;
  }
  const rows=[];
  for(const ag of (STATE.distro||[])){
    if(ag.type.toLowerCase()!=='prod agent')continue;
    const buckets=[];
    for(const [bk,bv] of Object.entries(byAgentCoord)){
      const parts=bk.split('|');
      if(parts[0]===ag.nameKey)buckets.push(bv);
    }
    if(buckets.length===0){
      rows.push({nameKey:ag.nameKey,agent:ag.agent,coord:ag.coord,senior:ag.senior,
        cluster:ag.cluster,extension:ag.extension,callsAt:0,callsIn:0,callsOut:0,
        rr:null,csat:null,qaScore:STATE.qa[ag.nameKey]?.score??null,
        aht:null,releasedPct:null,outboundPct:null,surveysSent:0,surveysAnswered:0,sdr:null,srr:null,
        acwMin:null,holdMin:null,breakMin:null,banoMin:null,
        servTotal:0,servComp:0,servCanc:0,quejasTotal:0,quejasYellow:0,quejasRed:0,isCoordSplit:false});
      continue;
    }
    const hasSplit=buckets.length>1;
    const quejas=(STATE.quejas||[]).filter(q=>q.nameKey===ag.nameKey&&q.fecha>=startDate&&q.fecha<=endDate);
    const quejasYellow=quejas.filter(q=>(q.tarjeta||'').toLowerCase().includes('amaril')).length;
    const quejasRed=quejas.filter(q=>(q.tarjeta||'').toLowerCase().includes('roj')).length;
    for(let i=0;i<buckets.length;i++){
      const v=buckets[i];
      const callsAt=(v.callsIn||0)+(v.callsOut||0);
      const aht=v.ahtN?v.ahtSecSum/v.ahtN:null;
      const rr=v.rrN?v.rrPctSum/v.rrN:null;
      const csat=v.csatN?v.csatPctSum/v.csatN:null;
      const sdr=v.callsIn?(v.surveysSent/v.callsIn)*100:null;
      const srr=v.surveysSent?(v.surveysAnswered/v.surveysSent)*100:null;
      const releasedPct=v.totalEntrantes?(v.released/v.totalEntrantes)*100:null;
      const outboundPct=callsAt?(v.callsOut/callsAt)*100:null;
      const coordForRow=v.coord||ag.coord;
      let seniorForRow=ag.senior;
      const distroOtroCoord=(STATE.distro||[]).find(a=>a.coord===coordForRow);
      if(distroOtroCoord)seniorForRow=distroOtroCoord.senior;
      rows.push({nameKey:ag.nameKey,agent:ag.agent,coord:coordForRow,senior:seniorForRow,
        cluster:ag.cluster,extension:ag.extension,callsAt,callsIn:v.callsIn||0,callsOut:v.callsOut||0,
        rr,csat,qaScore:STATE.qa[ag.nameKey]?.score??null,aht,releasedPct,outboundPct,
        surveysSent:v.surveysSent||0,surveysAnswered:v.surveysAnswered||0,sdr,srr,
        acwMin:v.acwN?v.acwMinSum/v.acwN:null,holdMin:v.holdN?v.holdMinSum/v.holdN:null,
        breakMin:v.breakDays?v.breakSum/v.breakDays:null,banoMin:v.banoDays?v.banoSum/v.banoDays:null,
        servTotal:v.servTotal||0,servComp:v.servComp||0,servCanc:v.servCanc||0,
        quejasTotal:i===0?quejas.length:0,quejasYellow:i===0?quejasYellow:0,quejasRed:i===0?quejasRed:0,
        isCoordSplit:hasSplit,coordDias:v.n||0});
    }
  }
  return rows;
}

function getWeekRange(dateStr){
  const d=new Date(dateStr+'T00:00:00');
  const day=d.getDay()||7;
  const monday=new Date(d);monday.setDate(d.getDate()-day+1);
  const sunday=new Date(monday);sunday.setDate(monday.getDate()+6);
  const fmtDate=dt=>dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0');
  const meses=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  const fmtSpa=dt=>dt.getDate()+' '+meses[dt.getMonth()]+' '+dt.getFullYear();
  return{start:fmtDate(monday),end:fmtDate(sunday),label:fmtSpa(monday)+' al '+fmtSpa(sunday)};
}

function listAvailableWeeks(){
  const dates=[...new Set(STATE.history.map(h=>h.date))].sort();
  if(!dates.length)return[];
  const weeks={};
  for(const d of dates){const w=getWeekRange(d);weeks[w.start]={start:w.start,end:w.end,label:w.label};}
  return Object.values(weeks).sort((a,b)=>b.start.localeCompare(a.start));
}

function viewInforme(){
  const weeks=listAvailableWeeks();
  if(!weeks.length){return'<div class="card"><div class="empty"><div class="empty-title">Sin datos</div><p class="muted">Carga datos en el histórico para generar informes</p></div></div>';}
  if(!STATE.informeWeek)STATE.informeWeek=weeks[0].start;
  const selectedWeek=weeks.find(w=>w.start===STATE.informeWeek)||weeks[0];
  const rows=buildScorecardForRange(selectedWeek.start,selectedWeek.end);
  let totalLlamadasIn=0,totalLlamadasOut=0,totalEncSent=0,totalEncAns=0,totalServ=0,totalServComp=0;
  let rrSum=0,rrN=0,csatSum=0,csatN=0,qaSum=0,qaN=0;
  let agentsRR=0,agentsCSAT=0,agentsQA=0,totalBono=0;
  const tierCount={0:0,1:0,2:0,3:0};
  for(const r of rows){
    totalLlamadasIn+=(r.callsIn||0);totalLlamadasOut+=(r.callsOut||0);
    totalEncSent+=(r.surveysSent||0);totalEncAns+=(r.surveysAnswered||0);
    totalServ+=(r.servTotal||0);totalServComp+=(r.servComp||0);
    if(r.rr!=null){rrSum+=r.rr;rrN++;if(r.rr>=CFG.META_RR)agentsRR++;}
    if(r.csat!=null){csatSum+=r.csat;csatN++;if(r.csat>=CFG.META_CSAT)agentsCSAT++;}
    if(r.qaScore!=null){qaSum+=r.qaScore;qaN++;if(r.qaScore>=CFG.META_QA)agentsQA++;}
    const b=calcBono(r);totalBono+=b.bonus;tierCount[b.tier]=(tierCount[b.tier]||0)+1;
  }
  const totalAgents=rows.length;
  const totalLlamadas=totalLlamadasIn+totalLlamadasOut;
  const avgRR=rrN?rrSum/rrN:null;const avgCSAT=csatN?csatSum/csatN:null;const avgQA=qaN?qaSum/qaN:null;
  const byCoord={};
  for(const r of rows){
    if(!byCoord[r.coord])byCoord[r.coord]={coord:r.coord,senior:r.senior,agents:[],bonusTotal:0,agentsBonus:0};
    byCoord[r.coord].agents.push(r);
    const b=calcBono(r);byCoord[r.coord].bonusTotal+=b.bonus;if(b.bonus>0)byCoord[r.coord].agentsBonus++;
  }
  const coordList=Object.values(byCoord).sort((a,b)=>b.bonusTotal-a.bonusTotal);
  const sorted=rows.map(r=>({...r,bono:calcBono(r)})).sort((a,b)=>b.bono.adjustedPoints-a.bono.adjustedPoints);
  const top5=sorted.slice(0,5);const bottom5=sorted.slice(-5).reverse();
  const progressBar=(label,value,target,achievers,total)=>{
    const ok=value!=null&&value>=target;const pct=value!=null?Math.min(100,Math.max(0,value)):0;const color=ok?'#10b981':'#ef4444';
    return'<div class="report-progress-row"><div class="report-progress-header"><span class="report-progress-label">'+label+'</span><span class="report-progress-value" style="color:'+color+'">'+fmt.pct(value)+' <span class="muted" style="font-size:11px">vs meta &ge;'+target+'%</span></span></div><div class="report-progress-bar"><div class="report-progress-fill" style="width:'+pct+'%;background:'+color+'"></div></div><div class="report-progress-count">'+achievers+' de '+total+' agentes en target ('+(total?Math.round(achievers/total*100):0)+'%)</div></div>';
  };
  let html='<div class="card no-print"><div class="filter-row" style="align-items:flex-end">';
  html+='<div class="field" style="flex:1.5"><label>Semana del informe</label><select onchange="STATE.informeWeek=this.value;renderActiveTab()">';
  html+=weeks.map(w=>'<option value="'+w.start+'"'+(w.start===selectedWeek.start?' selected':'')+'>'+w.label+'</option>').join('');
  html+='</select></div>';
  html+='<div class="field"><label>&nbsp;</label><button class="btn primary admin-only" onclick="exportInforme()">🖨️ Exportar a PDF</button> <span class="muted not-admin" style="font-size:11px">Activa modo admin para exportar</span></div>';
  html+='</div></div>';
  html+='<div id="reportContent" class="report-doc">';
  html+='<div class="report-header"><div><div class="report-title">Informe Operativo Semanal</div><div class="report-subtitle">Roomonitor &middot; '+selectedWeek.label+'</div></div><div class="report-brand">SCORECARD &middot; ROOMONITOR 2026</div></div>';
  html+='<div class="report-section"><h3>📞 Volumen del periodo</h3><div class="report-kpis">';
  html+='<div class="report-kpi"><div class="report-kpi-value">'+fmt.num(totalLlamadas)+'</div><div class="report-kpi-label">Llamadas atendidas</div><div class="report-kpi-sub">'+fmt.num(totalLlamadasIn)+' ent &middot; '+fmt.num(totalLlamadasOut)+' sal</div></div>';
  html+='<div class="report-kpi"><div class="report-kpi-value">'+fmt.num(totalEncSent)+'</div><div class="report-kpi-label">Encuestas enviadas</div><div class="report-kpi-sub">'+fmt.num(totalEncAns)+' respondidas ('+(totalEncSent?Math.round(totalEncAns/totalEncSent*100):0)+'%)</div></div>';
  html+='<div class="report-kpi"><div class="report-kpi-value">'+fmt.num(totalServ)+'</div><div class="report-kpi-label">Servicios solicitados</div><div class="report-kpi-sub">'+fmt.num(totalServComp)+' completados</div></div>';
  html+='<div class="report-kpi"><div class="report-kpi-value">'+totalAgents+'</div><div class="report-kpi-label">Prod Agents activos</div><div class="report-kpi-sub">'+coordList.length+' coordinadores</div></div>';
  html+='<div class="report-kpi report-kpi-accent"><div class="report-kpi-value">'+fmt.money(totalBono)+'</div><div class="report-kpi-label">Total bonos del periodo</div><div class="report-kpi-sub">'+(tierCount[3]+tierCount[2]+tierCount[1])+' de '+totalAgents+' agentes con bono</div></div>';
  html+='</div></div>';
  html+='<div class="report-section"><h3>🎯 Cumplimiento de metas</h3><div class="report-progress-grid">';
  html+=progressBar('Resolution Rate (RR)',avgRR,CFG.META_RR,agentsRR,rrN);
  html+=progressBar('Customer Satisfaction (CSAT)',avgCSAT,CFG.META_CSAT,agentsCSAT,csatN);
  html+=progressBar('Quality Assurance (QA)',avgQA,CFG.META_QA,agentsQA,qaN);

// VIEW: LLAMADAS LARGAS (≥ 20 min)
// ═══════════════════════════════════════════════════════════════════════════
function viewLlamadasLargas(){
  const sessionCalls=STATE.longCalls||[];
  const backendCalls=STATE.longCallsBackend||[];
  const seen={};
  const all=[];
  for(const c of [...sessionCalls,...backendCalls]){
    const k=c.date+'|'+c.hora+'|'+c.nameKey+'|'+c.duration;
    if(seen[k])continue;
    seen[k]=true;
    all.push(c);
  }
  if(!all.length){
    return `<div class="card"><div class="empty">
      <div class="empty-title">Sin llamadas largas</div>
      <p class="muted">No hay llamadas ≥ 20 minutos registradas.</p>
      <p class="muted" style="font-size:11px;margin-top:8px">Sube el archivo de llamadas desde "Cargar datos" para detectar llamadas largas del periodo.</p>
    </div></div>`;
  }
  const filterAgent=$('llFilterAgent')?$('llFilterAgent').value:'';
  const filterCoord=$('llFilterCoord')?$('llFilterCoord').value:'';
  const filterDate=$('llFilterDate')?$('llFilterDate').value:'';
  const agentCoord={};
  for(const ag of (STATE.distro||[]))agentCoord[ag.nameKey]=ag.coord;
  let filtered=all.filter(c=>{
    if(filterAgent&&c.nameKey!==filterAgent)return false;
    if(filterCoord&&agentCoord[c.nameKey]!==filterCoord)return false;
    if(filterDate&&c.date!==filterDate)return false;
    return true;
  });
  filtered.sort((a,b)=>{
    const cmp=(b.date||'').localeCompare(a.date||'');
    if(cmp!==0)return cmp;
    return (b.hora||'').localeCompare(a.hora||'');
  });
  const agents=[...new Set(all.map(c=>c.nameKey))].map(k=>{
    const ag=(STATE.distro||[]).find(a=>a.nameKey===k);
    return{nameKey:k,name:ag?ag.agent:k};
  }).sort((a,b)=>a.name.localeCompare(b.name));
  const coords=[...new Set(all.map(c=>agentCoord[c.nameKey]).filter(Boolean))].sort();
  const dates=[...new Set(all.map(c=>c.date))].sort().reverse();
  const totalDur=filtered.reduce((s,c)=>s+(c.duration||0),0);
  const avgDur=filtered.length?Math.round(totalDur/filtered.length):0;
  const maxDur=filtered.length?Math.max(...filtered.map(c=>c.duration||0)):0;
  return `
    <div class="card">
      <div class="section-title">📞 Llamadas largas (≥ 20 minutos)</div>
      <p class="section-sub">Llamadas detectadas con duración ≥ 20 minutos. Estas son las que afectan el P90 de los agentes.</p>
      <div class="metric-grid" style="margin-top:14px">
        <div class="metric-tile"><div class="metric-tile-label">Total filtradas</div><div class="metric-tile-value">${filtered.length}</div><div class="metric-tile-meta">de ${all.length} totales</div></div>
        <div class="metric-tile"><div class="metric-tile-label">Duración promedio</div><div class="metric-tile-value">${fmt.secs(avgDur)}</div><div class="metric-tile-meta">en filtro actual</div></div>
        <div class="metric-tile"><div class="metric-tile-label">Duración máxima</div><div class="metric-tile-value">${fmt.secs(maxDur)}</div><div class="metric-tile-meta">la más larga</div></div>
      </div>
    </div>
    <div class="card">
      <div class="filter-row" style="margin-bottom:12px">
        <div class="field"><label>Agente</label><select id="llFilterAgent" onchange="renderActiveTab()">
          <option value="">Todos (${agents.length})</option>
          ${agents.map(a=>`<option value="${a.nameKey}"${a.nameKey===filterAgent?' selected':''}>${a.name}</option>`).join('')}
        </select></div>
        <div class="field"><label>Coordinador</label><select id="llFilterCoord" onchange="renderActiveTab()">
          <option value="">Todos</option>
          ${coords.map(c=>`<option value="${c}"${c===filterCoord?' selected':''}>${c}</option>`).join('')}
        </select></div>
        <div class="field"><label>Fecha</label><select id="llFilterDate" onchange="renderActiveTab()">
          <option value="">Todas</option>
          ${dates.map(d=>`<option value="${d}"${d===filterDate?' selected':''}>${fmt.date(d)}</option>`).join('')}
        </select></div>
      </div>
      <div style="overflow-x:auto;max-height:65vh;overflow-y:auto">
      <table>
        <thead><tr>
          <th>Agente</th><th>Coord</th><th>Fecha</th><th>Hora</th><th>Tipo</th>
          <th class="col-num">Duración</th><th>Grabación</th>
        </tr></thead>
        <tbody>
          ${filtered.map(c=>{
            const coord=agentCoord[c.nameKey]||'—';
            const ag=(STATE.distro||[]).find(a=>a.nameKey===c.nameKey);
            const agentName=ag?ag.agent:c.agent;
            const link=c.grabacion&&c.grabacion.startsWith('http')?
              `<a href="${c.grabacion}" target="_blank" style="color:var(--accent);text-decoration:underline">▶ Escuchar</a>`:
              '<span class="muted">—</span>';
            return `<tr>
              <td class="col-name">${agentName}</td>
              <td class="muted">${coord}</td>
              <td>${fmt.date(c.date)}</td>
              <td class="muted">${c.hora||'—'}</td>
              <td><span class="b ${c.tipo==='Entrante'?'ok':'neutral'}">${c.tipo}</span></td>
              <td class="col-num"><strong>${fmt.secs(c.duration)}</strong></td>
              <td>${link}</td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
      </div>
      ${filtered.length===0?'<div class="muted" style="text-align:center;padding:20px">Sin resultados con los filtros actuales</div>':''}
    </div>
  `;
}

function onFileSelected(key,file){
  if(!file)return;
  STATE.pendingUploads[key]=file;
  renderActiveTab();
}

async function processUploads(){
  const pin=$('uploadPin').value;
  if(pin!==CFG.UPLOAD_PIN){
    showBanner('error','PIN incorrecto. Solo personas autorizadas pueden guardar datos.');
    return;
  }
  STATE.authenticated=true;
  const fallbackDate=$('uploadDate').value||STATE.uploadDate;
  STATE.uploadDate=fallbackDate;
  const status=$('uploadStatus');
  status.innerHTML='<div class="banner info"><span class="spinner"></span> Procesando archivos…</div>';
  const log=[];
  const byDate={};
  const ensure=(date,key)=>{
    if(!byDate[date])byDate[date]={};
    if(!byDate[date][key])byDate[date][key]={fullName:key};
    return byDate[date][key];
  };
  try{
    if(STATE.pendingUploads.encuestas){
      log.push('Procesando encuestas…');
      status.innerHTML=`<div class="banner info"><span class="spinner"></span> ${log.join('<br>')}</div>`;
      const encByDate=await parseEncuestas(STATE.pendingUploads.encuestas,fallbackDate);
      let totalDays=0;
      for(const [date,agents] of Object.entries(encByDate)){
        totalDays++;
        for(const [k,v] of Object.entries(agents)){
          const a=ensure(date,k);
          a.fullName=v.fullName;
          a.surveysSent=v.sent;a.surveysAnswered=v.answered;
          a.surveysSentIn=v.sentIn||0;a.surveysSentOut=v.sentOut||0;
          a.surveysAnsIn=v.ansIn||0;a.surveysAnsOut=v.ansOut||0;
          a.rrPctSum=v.rrSum;a.rrN=v.rrN;
          a.csatPctSum=v.csatSum;a.csatN=v.csatN;
        }
      }
      log[log.length-1]=`✓ Encuestas: ${totalDays} días procesados`;
    }
    if(STATE.pendingUploads.llamadas){
      log.push('Procesando llamadas…');
      status.innerHTML=`<div class="banner info"><span class="spinner"></span> ${log.join('<br>')}</div>`;
      const llamByDate=await parseLlamadas(STATE.pendingUploads.llamadas,fallbackDate);
      let totalDays=0;
      for(const [date,agents] of Object.entries(llamByDate)){
        totalDays++;
        for(const [k,v] of Object.entries(agents)){
          const a=ensure(date,k);
          if(!a.fullName||a.fullName===k)a.fullName=v.fullName;
          a.callsAt=(v.atendidasIn||0)+(v.atendidasOut||0);
          a.callsIn=v.atendidasIn;a.callsOut=v.atendidasOut;
          a.ahtSecSum=v.ahtSum;a.ahtN=v.ahtN;
          a.released=v.released;a.totalEntrantes=v.totalEntrantes;
          a.durations=v.durations||[];
        }
      }
      log[log.length-1]=`✓ Llamadas: ${totalDays} días procesados`;
    }
    if(STATE.pendingUploads.auxiliares){
      log.push('Procesando auxiliares…');
      status.innerHTML=`<div class="banner info"><span class="spinner"></span> ${log.join('<br>')}</div>`;
      const auxByDate=await parseAuxiliares(STATE.pendingUploads.auxiliares,fallbackDate);
      let totalDays=0;
      for(const [date,agents] of Object.entries(auxByDate)){
        totalDays++;
        for(const [k,v] of Object.entries(agents)){
          const a=ensure(date,k);
          if(!a.fullName||a.fullName===k)a.fullName=v.fullName;
          a.acwMinSum=v.acwSum;a.acwN=v.acwN;
          a.holdMinSum=v.holdSum;a.holdN=v.holdN;
          a.breakSum=v.breakSum;a.banoSum=v.banoSum;
        }
      }
      log[log.length-1]=`✓ Auxiliares: ${totalDays} días procesados`;
    }
    if(STATE.pendingUploads.servicios){
      log.push('Procesando servicios…');
      status.innerHTML=`<div class="banner info"><span class="spinner"></span> ${log.join('<br>')}</div>`;
      const servByDate=await parseServicios(STATE.pendingUploads.servicios,fallbackDate);
      let totalDays=0;
      for(const [date,agents] of Object.entries(servByDate)){
        totalDays++;
        for(const [k,v] of Object.entries(agents)){
          const a=ensure(date,k);
          if(!a.fullName||a.fullName===k)a.fullName=v.fullName;
          a.servTotal=v.total;a.servComp=v.completed;a.servCanc=v.canceled;
        }
      }
      log[log.length-1]=`✓ Servicios: ${totalDays} días procesados`;
    }
    if(CFG.BACKEND_URL){
      const dates=Object.keys(byDate).sort();
      const allRecords=[];
      const coordDurations={};
      const agentToCoord={};
      for(const ag of (STATE.distro||[]))agentToCoord[ag.nameKey]=ag.coord;
      if(STATE.pendingUploads.llamadas){
        const llamByDate=await parseLlamadas(STATE.pendingUploads.llamadas,fallbackDate);
        for(const [date,agents] of Object.entries(llamByDate)){
          if(!coordDurations[date])coordDurations[date]={};
          for(const [k,v] of Object.entries(agents)){
            const coord=agentToCoord[k];
            if(!coord||!v.durations||!v.durations.length)continue;
            if(!coordDurations[date][coord])coordDurations[date][coord]=[];
            coordDurations[date][coord].push(...v.durations);
          }
        }
      }
      const coordRecords=[];
      for(const [date,coords] of Object.entries(coordDurations)){
        for(const [coordName,durations] of Object.entries(coords)){
          if(!durations.length)continue;
          const p90=percentile(durations,90);
          const under20=durations.filter(d=>d<1200).length;
          const pctUnder20=(under20/durations.length)*100;
          coordRecords.push({date,coordName,p90Sec:p90,totalCalls:durations.length,callsUnder20Min:under20,ahtP90Pct:pctUnder20});
        }
      }
      for(const date of dates){
        const agents=byDate[date];
        for(const [k,v] of Object.entries(agents)){
          let callsUnder20=0;
          if(v.durations&&v.durations.length)callsUnder20=v.durations.filter(d=>d<1200).length;
          allRecords.push({
            date,nameKey:k,fullName:v.fullName||k,
            surveysSent:v.surveysSent||0,surveysAnswered:v.surveysAnswered||0,
            surveysSentIn:v.surveysSentIn||0,surveysSentOut:v.surveysSentOut||0,
            surveysAnsIn:v.surveysAnsIn||0,surveysAnsOut:v.surveysAnsOut||0,
            rrPctSum:v.rrPctSum||0,rrN:v.rrN||0,
            csatPctSum:v.csatPctSum||0,csatN:v.csatN||0,
            callsAt:v.callsAt||0,callsIn:v.callsIn||0,callsOut:v.callsOut||0,
            ahtSecSum:v.ahtSecSum||0,ahtN:v.ahtN||0,
            released:v.released||0,totalEntrantes:v.totalEntrantes||0,
            acwMinSum:v.acwMinSum||0,acwN:v.acwN||0,
            holdMinSum:v.holdMinSum||0,holdN:v.holdN||0,
            breakSum:v.breakSum||0,banoSum:v.banoSum||0,
            servTotal:v.servTotal||0,servComp:v.servComp||0,servCanc:v.servCanc||0,
            qaScore:STATE.qa[k]?STATE.qa[k].score:'',
            callsUnder20Min:callsUnder20
          });
        }
      }
      log.push(`Guardando ${allRecords.length} registros (${dates.length} días) en UN solo envío…`);
      status.innerHTML=`<div class="banner info"><span class="spinner"></span> ${log.join('<br>')}</div>`;
      const longCallsToSend=STATE.longCalls||[];
      await pushBackend({type:'bulk',dates,records:allRecords,coordRecords,longCalls:longCallsToSend});
      log[log.length-1]=`✓ Guardado: ${allRecords.length} registros en ${dates.length} día(s)`;
      log.push('Refrescando histórico…');
      status.innerHTML=`<div class="banner info"><span class="spinner"></span> ${log.join('<br>')}</div>`;
      await fetchBackendHistory();
      log[log.length-1]='✓ Histórico actualizado';
    }else{
      log.push('⚠ No hay backend configurado. Ve a Configuración para añadir la URL.');
    }
    if(STATE.pendingUploads.qa_file){
      log.push('Procesando QA scores…');
      status.innerHTML=`<div class="banner info"><span class="spinner"></span> ${log.join('<br>')}</div>`;
      const qaData=await parseQAFile(STATE.pendingUploads.qa_file);
      if(qaData&&Object.keys(qaData).length>0){
        STATE.qa=qaData;
        STATE.qaFileMonth=Object.values(qaData).find(v=>v.mes)?.mes||null;
        if(CFG.BACKEND_URL){
          try{
            await pushBackend({type:'qa',data:qaData,mes:STATE.qaFileMonth});
          }catch(e){
            log[log.length-1]+=' (sin sync backend)';
          }
        };
        if(CFG.BACKEND_URL){
          try{
            await pushBackend({type:'qa',data:qaData,mes:STATE.qaFileMonth});
          }catch(e){
            log[log.length-1]+=' (sin sync backend)';
          }
        }
        STATE.lastSync.qa=Date.now();
        setSync('QA','live',`QA · ${Object.keys(qaData).length}`);
        log[log.length-1]=`✓ QA: ${Object.keys(qaData).length} agentes cargados`;
      }else{
        log[log.length-1]='⚠ QA: no se pudo leer el archivo o está vacío';
      }
    }
    status.innerHTML=`<div class="banner success">${log.join('<br>')}</div>`;
    STATE.pendingUploads={encuestas:null,llamadas:null,auxiliares:null,servicios:null,qa_file:null};
    renderActiveTab();
  }catch(e){
    console.error(e);
    log.push('✗ Error: '+e.message);
    status.innerHTML=`<div class="banner error">${log.join('<br>')}</div>`;
  }
}

function buildHistoryRecords(date){
  const records=[];
  const agentKeys=new Set([
    ...Object.keys(STATE.encuestas),...Object.keys(STATE.llamadas),
    ...Object.keys(STATE.auxiliares),...Object.keys(STATE.servicios)
  ]);
  for(const k of agentKeys){
    const enc=STATE.encuestas[k]||{};
    const llam=STATE.llamadas[k]||{};
    const aux=STATE.auxiliares[k]||{};
    const serv=STATE.servicios[k]||{};
    const fullName=enc.fullName||llam.fullName||aux.fullName||serv.fullName||k;
    const callsAt=(llam.atendidasIn||0)+(llam.atendidasOut||0);
    records.push({
      date,nameKey:k,fullName,
      surveysSent:enc.sent||0,surveysAnswered:enc.answered||0,
      rrPctSum:enc.rrSum||0,rrN:enc.rrN||0,
      csatPctSum:enc.csatSum||0,csatN:enc.csatN||0,
      callsAt,callsIn:llam.atendidasIn||0,callsOut:llam.atendidasOut||0,
      ahtSecSum:llam.ahtSum||0,ahtN:llam.ahtN||0,
      released:llam.released||0,totalEntrantes:llam.totalEntrantes||0,
      acwMinSum:aux.acwSum||0,acwN:aux.acwN||0,
      holdMinSum:aux.holdSum||0,holdN:aux.holdN||0,
      breakSum:aux.breakSum||0,banoSum:aux.banoSum||0,
      servTotal:serv.total||0,servComp:serv.completed||0,servCanc:serv.canceled||0,
      qaScore:STATE.qa[k]?STATE.qa[k].score:null
    });
  }
  return records;
}

    <div class="card">
      <div class="section-title">Metas del scorecard</div>

        <div class="field"><label>Meta RR (%)</label><input type="number" id="metaRR" value="${CFG.META_RR}"></div>
        <div class="field"><label>Meta CSAT (%)</label><input type="number" id="metaCSAT" value="${CFG.META_CSAT}"></div>

        <div class="field"><label>Meta Survey Delivery (%)</label><input type="number" id="metaSDR" value="${CFG.META_SDR}"></div>
        <div class="field"><label>Meta Response Rate SRR (%)</label><input type="number" id="metaSRR" value="${CFG.META_SRR}"></div>
        <div class="field"><label>Meta AHT (segundos)</label><input type="number" id="metaAHT" value="${CFG.META_AHT_SEC}"></div>

function renderUnmatched(){
  const distroKeys=new Set(STATE.distro.map(a=>a.nameKey));
  const issues=[];
  const sources=[
    ['Encuestas',STATE.encuestas],['Llamadas',STATE.llamadas],
    ['Auxiliares',STATE.auxiliares],['Servicios',STATE.servicios],['QA',STATE.qa]
  ];
  for(const [name,obj] of sources){
    for(const [k,v] of Object.entries(obj||{})){
      if(!distroKeys.has(k))issues.push({source:name,key:k,fullName:v.fullName||k});
    }
  }
  if(!issues.length)return'<p class="muted" style="font-size:12px">Todos los agentes en datos hacen match con la distribución ✓</p>';
  return`<table>
    <thead><tr><th>Fuente</th><th>Nombre detectado</th><th>Clave normalizada</th></tr></thead>
    <tbody>
    ${issues.slice(0,30).map(i=>`<tr>
      <td>${i.source}</td><td class="col-name">${i.fullName}</td><td class="muted">${i.key}</td>
    </tr>`).join('')}
    </tbody>
  </table>${issues.length>30?`<p class="muted" style="font-size:11px;margin-top:6px">…y ${issues.length-30} más</p>`:''}`;
}

function saveConfig(){
  CFG.QA_URL=$('cfgQA').value;
  CFG.DISTRO_SHEET=$('cfgDistroId').value;
  CFG.DISTRO_TAB=$('cfgDistroTab').value;
  CFG.QUEJAS_SHEET=$('cfgQuejasId').value;
  CFG.AUSENTISMO_SHEET=$('cfgAusentismoId').value;
  CFG.AUSENTISMO_TAB=$('cfgAusentismoTab').value;
  CFG.BACKEND_URL=$('cfgBackend').value;
  CFG.UPLOAD_PIN=$('cfgPin').value;
  try{
    const cfg={QA_URL:CFG.QA_URL,DISTRO_SHEET:CFG.DISTRO_SHEET,DISTRO_TAB:CFG.DISTRO_TAB,QUEJAS_SHEET:CFG.QUEJAS_SHEET,AUSENTISMO_SHEET:CFG.AUSENTISMO_SHEET,AUSENTISMO_TAB:CFG.AUSENTISMO_TAB,BACKEND_URL:CFG.BACKEND_URL};
    localStorage.setItem('rmCfg',JSON.stringify(cfg));
  }catch(e){}
  showBanner('success','Configuración guardada en este navegador');
  fetchAll();
}

function saveMetas(){
  CFG.META_RR=+$('metaRR').value;
  CFG.META_CSAT=+$('metaCSAT').value;
  CFG.META_QA=+$('metaQA').value;
  CFG.META_SDR=+$('metaSDR').value;
  CFG.META_SRR=+$('metaSRR').value;
  CFG.META_AHT_SEC=+$('metaAHT').value;
  CFG.META_ACW_MIN=+$('metaACW').value;
  CFG.META_HOLD_MIN=+$('metaHOLD').value;
  CFG.META_BREAK_MIN=+$('metaBREAK').value;
  CFG.META_BANO_MIN=+$('metaBANO').value;
  try{
    const metas={META_RR:CFG.META_RR,META_CSAT:CFG.META_CSAT,META_QA:CFG.META_QA,META_SDR:CFG.META_SDR,META_SRR:CFG.META_SRR,META_AHT_SEC:CFG.META_AHT_SEC,META_ACW_MIN:CFG.META_ACW_MIN,META_HOLD_MIN:CFG.META_HOLD_MIN,META_BREAK_MIN:CFG.META_BREAK_MIN,META_BANO_MIN:CFG.META_BANO_MIN};

  showBanner('success','Metas guardadas en este navegador');

// ═══════════════════════════════════════════════════════════════════════════
// AUTH
// ═══════════════════════════════════════════════════════════════════════════
function checkAuth(){
  if(STATE.authenticated)return true;
  const pin=prompt('Ingresa el PIN para esta acción:');
  if(pin===CFG.UPLOAD_PIN){STATE.authenticated=true;return true;}
  showBanner('error','PIN incorrecto');
  return false;
}

function showBanner(type,msg,timeout=4000){
  const c=$('modalContainer');
  c.innerHTML=`<div style="position:fixed;bottom:20px;right:20px;z-index:1001;max-width:400px"><div class="banner ${type}">${msg}</div></div>`;
  setTimeout(()=>{c.innerHTML='';},timeout);
}

// ═══════════════════════════════════════════════════════════════════════════
// FILTRO DE BÚSQUEDA (con debounce para no perder foco al teclear)
// ═══════════════════════════════════════════════════════════════════════════
let _filterSearchTimer=null;
function onFilterSearchInput(input){
  if(_filterSearchTimer)clearTimeout(_filterSearchTimer);
  const cursorPos=input.selectionStart;
  const inputId=input.id;
  _filterSearchTimer=setTimeout(()=>{
    renderActiveTab();
    setTimeout(()=>{
      const newInput=document.getElementById(inputId);
      if(newInput){newInput.focus();try{newInput.setSelectionRange(cursorPos,cursorPos);}catch(e){}}
    },10);
  },300);
}

// ═══════════════════════════════════════════════════════════════════════════
// MODO ADMIN
// ═══════════════════════════════════════════════════════════════════════════
function toggleAdmin(){
  if(STATE.authenticated){
    STATE.authenticated=false;
    document.body.classList.remove('admin');
    $('adminIcon').textContent='🔒';
    $('adminLabel').textContent='Admin';
    const active=document.querySelector('.tab.active');
    if(active&&(active.dataset.tab==='cargar'||active.dataset.tab==='config')){
      document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
      document.querySelector('[data-tab="scorecard"]').classList.add('active');
      document.querySelectorAll('[id^=view-]').forEach(v=>v.classList.add('hidden'));
      $('view-scorecard').classList.remove('hidden');
      renderActiveTab();
    }
    showBanner('info','Sesión admin cerrada');
  }else{
    const pin=prompt('Ingresa el PIN de administrador:');
    if(pin==null)return;
    if(pin===CFG.UPLOAD_PIN){
      STATE.authenticated=true;
      document.body.classList.add('admin');
      $('adminIcon').textContent='🔓';
      $('adminLabel').textContent='Admin ON';
      showBanner('success','Modo admin activado · ahora ves Cargar datos y Configuración');
    }else{
      showBanner('error','PIN incorrecto');
    }
  }
}

// ═══════════════════════════════════════════════════════════════════════════
// QA MONTH SELECTOR
// ═══════════════════════════════════════════════════════════════════════════
function toggleQAMonthPicker(){
  const sel=$('qaMonthSelect');
  if(!sel)return;
  if(sel.style.display==='none'){populateQAMonthSelect();sel.style.display='inline-block';}
  else{sel.style.display='none';}
}

function populateQAMonthSelect(){
  const sel=$('qaMonthSelect');
  if(!sel)return;
  const months=STATE.qaAvailableMonths||[];
  if(!months.length){sel.innerHTML='<option>Sin datos</option>';return;}
  const fmtMonth=(ym)=>{
    const [y,m]=ym.split('-');
    const names=['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
    return names[parseInt(m)-1]+' '+y;
  };
  sel.innerHTML=months.map(m=>`<option value="${m}"${m===STATE.qaMonth?' selected':''}>${fmtMonth(m)}</option>`).join('');
}

function changeQAMonth(ym){
  STATE.qaMonth=ym;
  fetchQA();
}

// ═══════════════════════════════════════════════════════════════════════════
// INIT & EVENT LISTENERS
// ═══════════════════════════════════════════════════════════════════════════
async function fetchAll(){
  await Promise.all([fetchDistro(),fetchQuejas(),fetchAusentismo(),fetchBackendHistory()]);
}

function setupTabs(){
  document.querySelectorAll('.tab').forEach(t=>{
    t.addEventListener('click',()=>{
      document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
      t.classList.add('active');
      document.querySelectorAll('[id^=view-]').forEach(v=>v.classList.add('hidden'));
      $('view-'+t.dataset.tab).classList.remove('hidden');
      renderActiveTab();
    });
  });
}

function loadLocalConfig(){
  try{const cfg=localStorage.getItem('rmCfg');if(cfg)Object.assign(CFG,JSON.parse(cfg));}catch(e){}
  try{const metas=localStorage.getItem('rmMetas');if(metas)Object.assign(CFG,JSON.parse(metas));}catch(e){}
}

async function init(){
  loadLocalConfig();
  setupTabs();
  renderActiveTab();
  await fetchAll();
  setInterval(fetchQuejas,CFG.REFRESH_MS*5);
  setInterval(fetchDistro,CFG.REFRESH_MS*10);
  setInterval(fetchBackendHistory,CFG.REFRESH_MS*5);
}

window.addEventListener('DOMContentLoaded',init);

// Funciones expuestas globalmente para onclick handlers
window.renderActiveTab=renderActiveTab;
window.selectAgent=selectAgent;
window.savePenalties=savePenalties;
window.processUploads=processUploads;
window.onFileSelected=onFileSelected;
window.saveConfig=saveConfig;
window.saveMetas=saveMetas;
window.fetchAll=fetchAll;
window.changeDateMode=changeDateMode;
window.onFilterSearchInput=onFilterSearchInput;
window.resetTabFilterToMaster=resetTabFilterToMaster;
window.toggleAdmin=toggleAdmin;
window.saveCoordManual=saveCoordManual;
window.toggleQAMonthPicker=toggleQAMonthPicker;
window.changeQAMonth=changeQAMonth;
window.exportInforme=exportInforme;

</script>
