function getWeekRange(dateStr){
  const d=new Date(dateStr+'T00:00:00');
  const day=d.getDay()||7;
  const monday=new Date(d);
  monday.setDate(d.getDate()-day+1);
  const sunday=new Date(monday);
  sunday.setDate(monday.getDate()+6);
  const fmtDate=dt=>dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0');
  const meses=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  const fmtSpa=dt=>dt.getDate()+' '+meses[dt.getMonth()]+' '+dt.getFullYear();
  return{start:fmtDate(monday),end:fmtDate(sunday),label:fmtSpa(monday)+' al '+fmtSpa(sunday)};
}

function listAvailableWeeks(){
  const dates=[...new Set(STATE.history.map(h=>h.date))].sort();
  if(!dates.length)return[];
  const weeks={};
  for(const d of dates){
    const w=getWeekRange(d);
    weeks[w.start]={start:w.start,end:w.end,label:w.label};
  }
  return Object.values(weeks).sort((a,b)=>b.start.localeCompare(a.start));
}

function viewInforme(){
  const weeks=listAvailableWeeks();
  if(!weeks.length){
    return '<div class="card"><div class="empty"><div class="empty-title">Sin datos</div><p class="muted">Carga datos en el histórico para generar informes</p></div></div>';
  }
  if(!STATE.informeWeek)STATE.informeWeek=weeks[0].start;
  const selectedWeek=weeks.find(w=>w.start===STATE.informeWeek)||weeks[0];

  // Construir filas DIRECTAMENTE filtrando por la semana sin tocar STATE
  const rows=buildScorecardForRange(selectedWeek.start,selectedWeek.end);

  let totalLlamadasIn=0,totalLlamadasOut=0,totalEncSent=0,totalEncAns=0,totalServ=0,totalServComp=0;
  let rrSum=0,rrN=0,csatSum=0,csatN=0,qaSum=0,qaN=0;
  let agentsRR=0,agentsCSAT=0,agentsQA=0;
  let totalBono=0;
  const tierCount={0:0,1:0,2:0,3:0};

  for(const r of rows){
    totalLlamadasIn+=(r.callsIn||0);
    totalLlamadasOut+=(r.callsOut||0);
    totalEncSent+=(r.surveysSent||0);
    totalEncAns+=(r.surveysAnswered||0);
    totalServ+=(r.servTotal||0);
    totalServComp+=(r.servComp||0);
    if(r.rr!=null){rrSum+=r.rr;rrN++;if(r.rr>=CFG.META_RR)agentsRR++;}
    if(r.csat!=null){csatSum+=r.csat;csatN++;if(r.csat>=CFG.META_CSAT)agentsCSAT++;}
    if(r.qaScore!=null){qaSum+=r.qaScore;qaN++;if(r.qaScore>=CFG.META_QA)agentsQA++;}
    const b=calcBono(r);
    totalBono+=b.bonus;
    tierCount[b.tier]=(tierCount[b.tier]||0)+1;
  }

  const totalAgents=rows.length;
  const totalLlamadas=totalLlamadasIn+totalLlamadasOut;
  const avgRR=rrN?rrSum/rrN:null;
  const avgCSAT=csatN?csatSum/csatN:null;
  const avgQA=qaN?qaSum/qaN:null;

  const byCoord={};
  for(const r of rows){
    if(!byCoord[r.coord])byCoord[r.coord]={coord:r.coord,senior:r.senior,agents:[],bonusTotal:0,agentsBonus:0};
    byCoord[r.coord].agents.push(r);
    const b=calcBono(r);
    byCoord[r.coord].bonusTotal+=b.bonus;
    if(b.bonus>0)byCoord[r.coord].agentsBonus++;
  }
  const coordList=Object.values(byCoord).sort((a,b)=>b.bonusTotal-a.bonusTotal);

  const sorted=rows.map(r=>({...r,bono:calcBono(r)})).sort((a,b)=>b.bono.adjustedPoints-a.bono.adjustedPoints);
  const top5=sorted.slice(0,5);
  const bottom5=sorted.slice(-5).reverse();

  const progressBar=(label,value,target,achievers,total)=>{
    const ok=value!=null&&value>=target;
    const pct=value!=null?Math.min(100,Math.max(0,value)):0;
    const color=ok?'#10b981':'#ef4444';
    return '<div class="report-progress-row"><div class="report-progress-header"><span class="report-progress-label">'+label+'</span><span class="report-progress-value" style="color:'+color+'">'+fmt.pct(value)+' <span class="muted" style="font-size:11px">vs meta &ge;'+target+'%</span></span></div><div class="report-progress-bar"><div class="report-progress-fill" style="width:'+pct+'%;background:'+color+'"></div></div><div class="report-progress-count">'+achievers+' de '+total+' agentes en target ('+(total?Math.round(achievers/total*100):0)+'%)</div></div>';
  };

  let html='<div class="card no-print"><div class="filter-row" style="align-items:flex-end">';
  html+='<div class="field" style="flex:1.5"><label>Semana del informe</label><select onchange="STATE.informeWeek=this.value;renderActiveTab()">';
  html+=weeks.map(w=>'<option value="'+w.start+'"'+(w.start===selectedWeek.start?' selected':'')+'>'+w.label+'</option>').join('');
  html+='</select></div>';
  html+='<div class="field"><label>&nbsp;</label><button class="btn primary admin-only" onclick="exportInforme()">🖨️ Exportar a PDF</button> <span class="muted not-admin" style="font-size:11px">Activa modo admin para exportar</span></div>';
  html+='</div></div>';

  html+='<div id="reportContent" class="report-doc">';
  html+='<div class="report-header"><div><div class="report-title">Informe Operativo Semanal</div><div class="report-subtitle">Roomonitor &middot; '+selectedWeek.label+'</div></div><div class="report-brand">SCORECARD &middot; ROOMONITOR 2026</div></div>';

  html+='<div class="report-section"><h3>📞 Volumen del periodo</h3><div class="report-kpis">';
  html+='<div class="report-kpi"><div class="report-kpi-value">'+fmt.num(totalLlamadas)+'</div><div class="report-kpi-label">Llamadas atendidas</div><div class="report-kpi-sub">'+fmt.num(totalLlamadasIn)+' ent &middot; '+fmt.num(totalLlamadasOut)+' sal</div></div>';
  html+='<div class="report-kpi"><div class="report-kpi-value">'+fmt.num(totalEncSent)+'</div><div class="report-kpi-label">Encuestas enviadas</div><div class="report-kpi-sub">'+fmt.num(totalEncAns)+' respondidas ('+(totalEncSent?Math.round(totalEncAns/totalEncSent*100):0)+'%)</div></div>';
  html+='<div class="report-kpi"><div class="report-kpi-value">'+fmt.num(totalServ)+'</div><div class="report-kpi-label">Servicios solicitados</div><div class="report-kpi-sub">'+fmt.num(totalServComp)+' completados</div></div>';
  html+='<div class="report-kpi"><div class="report-kpi-value">'+totalAgents+'</div><div class="report-kpi-label">Prod Agents activos</div><div class="report-kpi-sub">'+coordList.length+' coordinadores</div></div>';
  html+='<div class="report-kpi report-kpi-accent"><div class="report-kpi-value">'+fmt.money(totalBono)+'</div><div class="report-kpi-label">Total bonos del periodo</div><div class="report-kpi-sub">'+(tierCount[3]+tierCount[2]+tierCount[1])+' de '+totalAgents+' agentes con bono</div></div>';
  html+='</div></div>';

  html+='<div class="report-section"><h3>🎯 Cumplimiento de metas</h3><div class="report-progress-grid">';
  html+=progressBar('Survey Return Rate (RR)',avgRR,CFG.META_RR,agentsRR,rrN);
  html+=progressBar('Customer Satisfaction (CSAT)',avgCSAT,CFG.META_CSAT,agentsCSAT,csatN);
  html+=progressBar('Quality Assurance (QA)',avgQA,CFG.META_QA,agentsQA,qaN);
  html+='</div></div>';

  html+='<div class="report-section"><h3>👥 Desempeño por coordinador</h3>';
  html+='<table class="report-table"><thead><tr><th>Coordinador</th><th>Senior</th><th class="col-num">Agentes</th><th class="col-num">Llamadas</th><th class="col-num">RR</th><th class="col-num">CSAT</th><th class="col-num">QA</th><th class="col-num">Con bono</th><th class="col-num">Bono total</th></tr></thead><tbody>';
  for(const c of coordList){
    const rrAg=c.agents.filter(a=>a.rr!=null);
    const csAg=c.agents.filter(a=>a.csat!=null);
    const qaAg=c.agents.filter(a=>a.qaScore!=null);
    const rrV=rrAg.length?rrAg.reduce((s,a)=>s+a.rr,0)/rrAg.length:null;
    const csV=csAg.length?csAg.reduce((s,a)=>s+a.csat,0)/csAg.length:null;
    const qaV=qaAg.length?qaAg.reduce((s,a)=>s+a.qaScore,0)/qaAg.length:null;
    const callsT=c.agents.reduce((s,a)=>s+(a.callsAt||0),0);
    html+='<tr><td><strong>'+c.coord+'</strong></td><td class="muted">'+(c.senior||'—')+'</td><td class="col-num">'+c.agents.length+'</td><td class="col-num">'+fmt.num(callsT)+'</td><td class="col-num">'+fmt.pct(rrV)+'</td><td class="col-num">'+fmt.pct(csV)+'</td><td class="col-num">'+fmt.pct(qaV)+'</td><td class="col-num">'+c.agentsBonus+'/'+c.agents.length+'</td><td class="col-num"><strong>'+fmt.money(c.bonusTotal)+'</strong></td></tr>';
  }
  html+='</tbody></table></div>';

  html+='<div class="report-section report-two-col">';
  html+='<div><h3>🏆 Top 5 agentes</h3><table class="report-table"><thead><tr><th>#</th><th>Agente</th><th>Coord</th><th class="col-num">Pts</th><th class="col-num">Bono</th></tr></thead><tbody>';
  top5.forEach((r,i)=>{
    html+='<tr><td>'+(i+1)+'</td><td><strong>'+r.agent+'</strong></td><td class="muted">'+r.coord+'</td><td class="col-num">'+fmt.num(r.bono.adjustedPoints)+'</td><td class="col-num"><strong>'+fmt.money(r.bono.bonus)+'</strong></td></tr>';
  });
  html+='</tbody></table></div>';
  html+='<div><h3>⚠️ Requieren atención</h3><table class="report-table"><thead><tr><th>#</th><th>Agente</th><th>Coord</th><th class="col-num">Pts</th><th class="col-num">Bono</th></tr></thead><tbody>';
  bottom5.forEach((r,i)=>{
    html+='<tr><td>'+(i+1)+'</td><td><strong>'+r.agent+'</strong></td><td class="muted">'+r.coord+'</td><td class="col-num">'+fmt.num(r.bono.adjustedPoints)+'</td><td class="col-num">'+fmt.money(r.bono.bonus)+'</td></tr>';
  });
  html+='</tbody></table></div></div>';

  html+='<div class="report-section"><h3>💰 Distribución de bonificaciones</h3><div class="report-tier-bars">';
  const tierMeta={3:{label:'Tier 3 ($300)',color:'#10b981'},2:{label:'Tier 2 ($200)',color:'#3b82f6'},1:{label:'Tier 1 ($100)',color:'#f59e0b'},0:{label:'Tier 0 ($0)',color:'#94a3b8'}};
  for(const t of [3,2,1,0]){
    const count=tierCount[t]||0;
    const pct=totalAgents?(count/totalAgents)*100:0;
    html+='<div class="report-tier-row"><div class="report-tier-label">'+tierMeta[t].label+'</div><div class="report-tier-bar"><div class="report-tier-fill" style="width:'+pct+'%;background:'+tierMeta[t].color+'"></div></div><div class="report-tier-count">'+count+' agentes</div></div>';
  }
  html+='</div></div>';

  html+='<div class="report-footer"><div>Generado: '+new Date().toLocaleString('es-ES')+'</div><div>Roomonitor 2026 &middot; Scorecard Operativo</div></div>';
  html+='</div>';
  return html;
}

function onFileSelected(key,file){
  if(!file)return;
  STATE.pendingUploads[key]=file;
  renderActiveTab();
}

async function processUploads(){
  const pin=$('uploadPin').value;
  if(pin!==CFG.UPLOAD_PIN){
    showBanner('error','PIN incorrecto. Solo personas autorizadas pueden guardar datos.');
    return;
  }
  STATE.authenticated=true;
  
  const fallbackDate=$('uploadDate').value||STATE.uploadDate;
  STATE.uploadDate=fallbackDate;
  const status=$('uploadStatus');
  status.innerHTML='<div class="banner info"><span class="spinner"></span> Procesando archivos…</div>';
  
  const log=[];
  // byDate[date][agentKey] = {sources combinadas}
  const byDate={};
  
  const ensure=(date,key)=>{
    if(!byDate[date])byDate[date]={};
    if(!byDate[date][key])byDate[date][key]={fullName:key};
    return byDate[date][key];
  };
  
  try{
    if(STATE.pendingUploads.encuestas){
      log.push('Procesando encuestas…');
      status.innerHTML=`<div class="banner info"><span class="spinner"></span> ${log.join('<br>')}</div>`;
      const encByDate=await parseEncuestas(STATE.pendingUploads.encuestas,fallbackDate);
      let totalDays=0;
      for(const [date,agents] of Object.entries(encByDate)){
        totalDays++;
        for(const [k,v] of Object.entries(agents)){
          const a=ensure(date,k);
          a.fullName=v.fullName;
          a.surveysSent=v.sent;a.surveysAnswered=v.answered;
          a.rrPctSum=v.rrSum;a.rrN=v.rrN;
          a.csatPctSum=v.csatSum;a.csatN=v.csatN;
        }
      }
      log[log.length-1]=`✓ Encuestas: ${totalDays} días procesados`;
    }
    if(STATE.pendingUploads.llamadas){
      log.push('Procesando llamadas…');
      status.innerHTML=`<div class="banner info"><span class="spinner"></span> ${log.join('<br>')}</div>`;
      const llamByDate=await parseLlamadas(STATE.pendingUploads.llamadas,fallbackDate);
      let totalDays=0;
      for(const [date,agents] of Object.entries(llamByDate)){
        totalDays++;
        for(const [k,v] of Object.entries(agents)){
          const a=ensure(date,k);
          if(!a.fullName||a.fullName===k)a.fullName=v.fullName;
          a.callsAt=(v.atendidasIn||0)+(v.atendidasOut||0);
          a.callsIn=v.atendidasIn;a.callsOut=v.atendidasOut;
          a.ahtSecSum=v.ahtSum;a.ahtN=v.ahtN;
          a.released=v.released;a.totalEntrantes=v.totalEntrantes;
        }
      }
      log[log.length-1]=`✓ Llamadas: ${totalDays} días procesados`;
    }
    if(STATE.pendingUploads.auxiliares){
      log.push('Procesando auxiliares…');
      status.innerHTML=`<div class="banner info"><span class="spinner"></span> ${log.join('<br>')}</div>`;
      const auxByDate=await parseAuxiliares(STATE.pendingUploads.auxiliares,fallbackDate);
      let totalDays=0;
      for(const [date,agents] of Object.entries(auxByDate)){
        totalDays++;
        for(const [k,v] of Object.entries(agents)){
          const a=ensure(date,k);
          if(!a.fullName||a.fullName===k)a.fullName=v.fullName;
          a.acwMinSum=v.acwSum;a.acwN=v.acwN;
          a.holdMinSum=v.holdSum;a.holdN=v.holdN;
          a.breakSum=v.breakSum;a.banoSum=v.banoSum;
        }
      }
      log[log.length-1]=`✓ Auxiliares: ${totalDays} días procesados`;
    }
    if(STATE.pendingUploads.servicios){
      log.push('Procesando servicios…');
      status.innerHTML=`<div class="banner info"><span class="spinner"></span> ${log.join('<br>')}</div>`;
      const servByDate=await parseServicios(STATE.pendingUploads.servicios,fallbackDate);
      let totalDays=0;
      for(const [date,agents] of Object.entries(servByDate)){
        totalDays++;
        for(const [k,v] of Object.entries(agents)){
          const a=ensure(date,k);
          if(!a.fullName||a.fullName===k)a.fullName=v.fullName;
          a.servTotal=v.total;a.servComp=v.completed;a.servCanc=v.canceled;
        }
      }
      log[log.length-1]=`✓ Servicios: ${totalDays} días procesados`;
    }
    
    // Guardar al backend en UN SOLO request (con todos los días)
    // Esto evita 403/rate-limit de auth de Roomonitor
    if(CFG.BACKEND_URL){
      const dates=Object.keys(byDate).sort();
      
      // Construir TODOS los records de todos los días en un array plano
      const allRecords=[];
      
      // Estructura para acumular duraciones por coord-día (para calcular P90)
      // coordDurations[date][coordName] = [duraciones...]
      const coordDurations={};
      
      // Mapa nameKey → coord (de la distro)
      const agentToCoord={};
      for(const ag of (STATE.distro||[])){
        agentToCoord[ag.nameKey]=ag.coord;
      }
      
      // Procesar llamadas para extraer duraciones por coord-día
      // Las duraciones están en el parser de llamadas (acumuladas como arrays)
      // Como ya las pasamos a byDate, hay que volver a leerlas del parser
      // Pero para no cambiar todo, lo hacemos aquí:
      // Reprocesamos solo el archivo de llamadas si está disponible
      if(STATE.pendingUploads.llamadas){
        const llamByDate=await parseLlamadas(STATE.pendingUploads.llamadas,fallbackDate);
        for(const [date,agents] of Object.entries(llamByDate)){
          if(!coordDurations[date])coordDurations[date]={};
          for(const [k,v] of Object.entries(agents)){
            const coord=agentToCoord[k];
            if(!coord||!v.durations||!v.durations.length)continue;
            if(!coordDurations[date][coord])coordDurations[date][coord]=[];
            coordDurations[date][coord].push(...v.durations);
          }
        }
      }
      
      // Calcular P90 por coord-día y agregar registros tipo "coord"
      const coordRecords=[];
      for(const [date,coords] of Object.entries(coordDurations)){
        for(const [coordName,durations] of Object.entries(coords)){
          if(!durations.length)continue;
          const p90=percentile(durations,90);
          const under20=durations.filter(d=>d<1200).length;
          const pctUnder20=(under20/durations.length)*100;
          coordRecords.push({
            date,coordName,
            p90Sec:p90,
            totalCalls:durations.length,
            callsUnder20Min:under20,
            ahtP90Pct:pctUnder20  // % de llamadas bajo 20 min (esta es la métrica que usa el bono)
          });
        }
      }
      
      for(const date of dates){
        const agents=byDate[date];
        for(const [k,v] of Object.entries(agents)){
          allRecords.push({
            date,nameKey:k,fullName:v.fullName||k,
            surveysSent:v.surveysSent||0,surveysAnswered:v.surveysAnswered||0,
            rrPctSum:v.rrPctSum||0,rrN:v.rrN||0,
            csatPctSum:v.csatPctSum||0,csatN:v.csatN||0,
            callsAt:v.callsAt||0,callsIn:v.callsIn||0,callsOut:v.callsOut||0,
            ahtSecSum:v.ahtSecSum||0,ahtN:v.ahtN||0,
            released:v.released||0,totalEntrantes:v.totalEntrantes||0,
            acwMinSum:v.acwMinSum||0,acwN:v.acwN||0,
            holdMinSum:v.holdMinSum||0,holdN:v.holdN||0,
            breakSum:v.breakSum||0,banoSum:v.banoSum||0,
            servTotal:v.servTotal||0,servComp:v.servComp||0,servCanc:v.servCanc||0,
            qaScore:STATE.qa[k]?STATE.qa[k].score:''
          });
        }
      }
      
      log.push(`Guardando ${allRecords.length} registros (${dates.length} días) en UN solo envío…`);
      status.innerHTML=`<div class="banner info"><span class="spinner"></span> ${log.join('<br>')}</div>`;
      
      // Un solo POST con todo
      await pushBackend({type:'bulk',dates,records:allRecords,coordRecords});
      
      log[log.length-1]=`✓ Guardado: ${allRecords.length} registros en ${dates.length} día(s)`;
      
      // Recargar histórico
      log.push('Refrescando histórico…');
      status.innerHTML=`<div class="banner info"><span class="spinner"></span> ${log.join('<br>')}</div>`;
      await fetchBackendHistory();
      log[log.length-1]='✓ Histórico actualizado';
    }else{
      log.push('⚠ No hay backend configurado. Ve a Configuración para añadir la URL.');
    }
    
    status.innerHTML=`<div class="banner success">${log.join('<br>')}</div>`;
    STATE.pendingUploads={encuestas:null,llamadas:null,auxiliares:null,servicios:null};
    renderActiveTab();
    
  }catch(e){
    console.error(e);
    log.push('✗ Error: '+e.message);
    status.innerHTML=`<div class="banner error">${log.join('<br>')}</div>`;
  }
}

function buildHistoryRecords(date){
  // Construye un record por agente para guardar en el backend
  const records=[];
  const agentKeys=new Set([
    ...Object.keys(STATE.encuestas),
    ...Object.keys(STATE.llamadas),
    ...Object.keys(STATE.auxiliares),
    ...Object.keys(STATE.servicios)
  ]);
  for(const k of agentKeys){
    const enc=STATE.encuestas[k]||{};
    const llam=STATE.llamadas[k]||{};
    const aux=STATE.auxiliares[k]||{};
    const serv=STATE.servicios[k]||{};
    const fullName=enc.fullName||llam.fullName||aux.fullName||serv.fullName||k;
    
    const callsAt=(llam.atendidasIn||0)+(llam.atendidasOut||0);
    const aht=llam.ahtN?llam.ahtSum/llam.ahtN:null;
    
    records.push({
      date,nameKey:k,fullName,
      surveysSent:enc.sent||0,surveysAnswered:enc.answered||0,
      rrPctSum:enc.rrSum||0,rrN:enc.rrN||0,
      csatPctSum:enc.csatSum||0,csatN:enc.csatN||0,
      callsAt,callsIn:llam.atendidasIn||0,callsOut:llam.atendidasOut||0,
      ahtSecSum:llam.ahtSum||0,ahtN:llam.ahtN||0,
      released:llam.released||0,
      totalEntrantes:llam.totalEntrantes||0,
      acwMinSum:aux.acwSum||0,acwN:aux.acwN||0,
      holdMinSum:aux.holdSum||0,holdN:aux.holdN||0,
      breakSum:aux.breakSum||0,banoSum:aux.banoSum||0,
      servTotal:serv.total||0,servComp:serv.completed||0,servCanc:serv.canceled||0,
      qaScore:STATE.qa[k]?STATE.qa[k].score:null
    });
  }
  return records;
}

function renderUnmatched(){
  const distroKeys=new Set(STATE.distro.map(a=>a.nameKey));
  const issues=[];
  const sources=[
    ['Encuestas',STATE.encuestas],['Llamadas',STATE.llamadas],
    ['Auxiliares',STATE.auxiliares],['Servicios',STATE.servicios],['QA',STATE.qa]
  ];
  for(const [name,obj] of sources){
    for(const [k,v] of Object.entries(obj||{})){
      if(!distroKeys.has(k))issues.push({source:name,key:k,fullName:v.fullName||k});
    }
  }
  if(!issues.length)return'<p class="muted" style="font-size:12px">Todos los agentes en datos hacen match con la distribución ✓</p>';
  return`<table>
    <thead><tr><th>Fuente</th><th>Nombre detectado</th><th>Clave normalizada</th></tr></thead>
    <tbody>
    ${issues.slice(0,30).map(i=>`<tr>
      <td>${i.source}</td>
      <td class="col-name">${i.fullName}</td>
      <td class="muted">${i.key}</td>
    </tr>`).join('')}
    </tbody>
  </table>${issues.length>30?`<p class="muted" style="font-size:11px;margin-top:6px">…y ${issues.length-30} más</p>`:''}`;
}

function saveConfig(){
  CFG.QA_URL=$('cfgQA').value;
  CFG.DISTRO_SHEET=$('cfgDistroId').value;
  CFG.DISTRO_TAB=$('cfgDistroTab').value;
  CFG.QUEJAS_SHEET=$('cfgQuejasId').value;
  CFG.BACKEND_URL=$('cfgBackend').value;
  CFG.UPLOAD_PIN=$('cfgPin').value;
  // Persistir en localStorage para esta navegador (PIN no, por seguridad)
  try{
    const cfg={QA_URL:CFG.QA_URL,DISTRO_SHEET:CFG.DISTRO_SHEET,DISTRO_TAB:CFG.DISTRO_TAB,QUEJAS_SHEET:CFG.QUEJAS_SHEET,BACKEND_URL:CFG.BACKEND_URL};

// AUTH
// ═══════════════════════════════════════════════════════════════════════════
function checkAuth(){
  if(STATE.authenticated)return true;
  const pin=prompt('Ingresa el PIN para esta acción:');
  if(pin===CFG.UPLOAD_PIN){
    STATE.authenticated=true;
    return true;
  }
  showBanner('error','PIN incorrecto');
  return false;
}

function showBanner(type,msg,timeout=4000){
  const c=$('modalContainer');
  c.innerHTML=`<div style="position:fixed;bottom:20px;right:20px;z-index:1001;max-width:400px"><div class="banner ${type}">${msg}</div></div>`;
  setTimeout(()=>{c.innerHTML='';},timeout);
}

// ═══════════════════════════════════════════════════════════════════════════
// FILTRO DE BÚSQUEDA (con debounce para no perder foco al teclear)
// ═══════════════════════════════════════════════════════════════════════════
let _filterSearchTimer=null;
function onFilterSearchInput(input){
  // Cancelar el timer anterior
  if(_filterSearchTimer)clearTimeout(_filterSearchTimer);
  
  // Guardar la posición del cursor
  const cursorPos=input.selectionStart;
  const inputId=input.id;
  
  // Esperar 300ms después de la última tecla, luego re-renderizar
  _filterSearchTimer=setTimeout(()=>{
    renderActiveTab();
    // Restaurar foco y cursor después del render
    setTimeout(()=>{
      const newInput=document.getElementById(inputId);
      if(newInput){
        newInput.focus();
        try{newInput.setSelectionRange(cursorPos,cursorPos);}catch(e){}
      }
    },10);
  },300);
}

// MODO ADMIN
// ═══════════════════════════════════════════════════════════════════════════
function toggleAdmin(){
  if(STATE.authenticated){
    // Cerrar sesión admin
    STATE.authenticated=false;
    document.body.classList.remove('admin');
    $('adminIcon').textContent='🔒';
    $('adminLabel').textContent='Admin';
    // Si estaba en una tab admin, regresar a Scorecard
    const active=document.querySelector('.tab.active');
    if(active&&(active.dataset.tab==='cargar'||active.dataset.tab==='config')){
      document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
      document.querySelector('[data-tab="scorecard"]').classList.add('active');
      document.querySelectorAll('[id^=view-]').forEach(v=>v.classList.add('hidden'));
      $('view-scorecard').classList.remove('hidden');
      renderActiveTab();
    }
    showBanner('info','Sesión admin cerrada');
  }else{
    // Iniciar sesión admin
    const pin=prompt('Ingresa el PIN de administrador:');
    if(pin==null)return; // canceló
    if(pin===CFG.UPLOAD_PIN){
      STATE.authenticated=true;
      document.body.classList.add('admin');
      $('adminIcon').textContent='🔓';
      $('adminLabel').textContent='Admin ON';
      showBanner('success','Modo admin activado · ahora ves Cargar datos y Configuración');
    }else{
      showBanner('error','PIN incorrecto');
    }
  }
}

// ═══════════════════════════════════════════════════════════════════════════
// QA MONTH SELECTOR
// ═══════════════════════════════════════════════════════════════════════════
function toggleQAMonthPicker(){
  const sel=$('qaMonthSelect');
  if(!sel)return;
  if(sel.style.display==='none'){
    populateQAMonthSelect();
    sel.style.display='inline-block';
  }else{
    sel.style.display='none';
  }
}

function populateQAMonthSelect(){
  const sel=$('qaMonthSelect');
  if(!sel)return;
  const months=STATE.qaAvailableMonths||[];
  if(!months.length){
    sel.innerHTML='<option>Sin datos</option>';
    return;
  }
  const fmtMonth=(ym)=>{
    const [y,m]=ym.split('-');
    const names=['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
    return names[parseInt(m)-1]+' '+y;
  };
  sel.innerHTML=months.map(m=>`<option value="${m}"${m===STATE.qaMonth?' selected':''}>${fmtMonth(m)}</option>`).join('');
}

function changeQAMonth(ym){
  STATE.qaMonth=ym;
  fetchQA(); // re-fetch con el nuevo mes
}

// ═══════════════════════════════════════════════════════════════════════════
// INIT & EVENT LISTENERS
// ═══════════════════════════════════════════════════════════════════════════
async function fetchAll(){
  await Promise.all([fetchDistro(),fetchQA(),fetchQuejas(),fetchBackendHistory()]);
}

function setupTabs(){
  document.querySelectorAll('.tab').forEach(t=>{
    t.addEventListener('click',()=>{
      document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
      t.classList.add('active');
      document.querySelectorAll('[id^=view-]').forEach(v=>v.classList.add('hidden'));
      $('view-'+t.dataset.tab).classList.remove('hidden');
      renderActiveTab();
    });
  });
}

function loadLocalConfig(){
  try{
    const cfg=localStorage.getItem('rmCfg');
    if(cfg)Object.assign(CFG,JSON.parse(cfg));
  }catch(e){}
  try{
    const metas=localStorage.getItem('rmMetas');
    if(metas)Object.assign(CFG,JSON.parse(metas));
  }catch(e){}
}

async function init(){
  loadLocalConfig();
  setupTabs();
  renderActiveTab();
  
  // Initial fetches
  await fetchAll();
  
  // Refresh interval
  setInterval(fetchQA,CFG.REFRESH_MS);
  setInterval(fetchQuejas,CFG.REFRESH_MS*5); // quejas cada 5 min
  setInterval(fetchDistro,CFG.REFRESH_MS*10); // distro cada 10 min
  setInterval(fetchBackendHistory,CFG.REFRESH_MS*5);
}

window.addEventListener('DOMContentLoaded',init);

// Funciones expuestas globalmente para onclick handlers
window.renderActiveTab=renderActiveTab;
window.selectAgent=selectAgent;
window.savePenalties=savePenalties;
window.processUploads=processUploads;
window.onFileSelected=onFileSelected;
window.saveConfig=saveConfig;
window.saveMetas=saveMetas;
window.fetchAll=fetchAll;
window.changeDateMode=changeDateMode;
window.onFilterSearchInput=onFilterSearchInput;
window.resetTabFilterToMaster=resetTabFilterToMaster;
window.toggleAdmin=toggleAdmin;
window.saveCoordManual=saveCoordManual;
window.toggleQAMonthPicker=toggleQAMonthPicker;
window.changeQAMonth=changeQAMonth;

</script>
